services:
  # PHP-FPM (TastyIgniter)
  app:
    build:
      context: .
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: cupnoodles/tastyigniter:php${PHP_VERSION:-8.3}
    restart: unless-stopped
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${HTTP_PORT:-8080}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: tastyigniter
      DB_USERNAME: tastyigniter
      DB_PASSWORD: password
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      # Xdebug is off by default. Enable with e.g. `XDEBUG_MODE=debug docker compose up -d`
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      XDEBUG_CONFIG: client_host=host.docker.internal client_port=9003 start_with_request=yes
      PHP_IDE_CONFIG: serverName=tastyigniter
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./php/local.ini:/usr/local/etc/php/conf.d/zz-local.ini:ro
      - ./tastyigniter:/var/www/tastyigniter
      - composer-cache:/home/www/.composer/cache
    depends_on:
      db:
        condition: service_healthy

  # Nginx
  webserver:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./tastyigniter:/var/www/tastyigniter:ro
      - ./nginx/conf.d/:/etc/nginx/conf.d/:ro
    depends_on:
      - app

  # MySQL
  db:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: tastyigniter
      MYSQL_USER: tastyigniter
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - dbdata:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/tastyigniter.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Catches all outgoing mail (order confirmations etc). Web UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

volumes:
  dbdata:
  composer-cache:
